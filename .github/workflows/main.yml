# Builds "Tiny Chatbot" as a Mac app and a Windows app on GitHub's computers,
# then puts them on this repository's Releases page along with an update pack.
# Apps that people already have find the update pack and update themselves.
#
# To run it: open the Actions tab, choose "Build desktop apps" on the left,
# then press "Run workflow". It takes about 10 minutes.

name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: write     # needed to publish the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Find the chatbot's folder
        run: |
          folder=$(dirname "$(git ls-files | grep -m 1 -E '(^|/)desktop_app\.py$')")
          echo "APP_DIR=$folder" >> "$GITHUB_ENV"
          echo "The chatbot's files are in: $folder"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools for building
        run: python -m pip install numpy pywebview certifi pyinstaller pillow

      - name: Stamp the version number and where updates come from
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "${{ github.run_number }}" > version.txt
          echo "${{ github.repository }}" > update_source.txt

      - name: Build the app
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Windows gets one single .exe file: nothing to unzip, nothing to unblock.
          if [ "$RUNNER_OS" = "Windows" ]; then sep=";"; layout="--onefile"; else sep=":"; layout="--onedir"; fi
          python -m PyInstaller --noconfirm --windowed $layout --name "Tiny Chatbot" \
            --icon app_icon.png \
            --add-data "tinychat_weights.npz${sep}." \
            --add-data "chat_page.html${sep}." \
            --add-data "version.txt${sep}." \
            --add-data "update_source.txt${sep}." \
            --hidden-import tools --hidden-import tinychat \
            --hidden-import webchat --hidden-import updater \
            --hidden-import certifi \
            desktop_app.py

      - name: Zip the Mac app
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}/dist
        run: ditto -c -k --keepParent "Tiny Chatbot.app" "$GITHUB_WORKSPACE/Tiny-Chatbot-Mac.zip"

      - name: Name the Windows app
        if: runner.os == 'Windows'
        working-directory: ${{ env.APP_DIR }}/dist
        run: cp "Tiny Chatbot.exe" "$GITHUB_WORKSPACE/Tiny-Chatbot-Windows.exe"

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            Tiny-Chatbot-Mac.zip
            Tiny-Chatbot-Windows.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Make the update pack
        run: |
          folder=$(dirname "$(git ls-files | grep -m 1 -E '(^|/)desktop_app\.py$')")
          cd "$folder"
          echo "${{ github.run_number }}" > version.txt
          python3 - <<'EOF'
          import hashlib, json, zipfile
          files = ["tools.py", "tinychat.py", "webchat.py", "updater.py",
                   "chat_page.html", "tinychat_weights.npz", "version.txt"]
          with zipfile.ZipFile("tiny-update.zip", "w", zipfile.ZIP_DEFLATED) as pack:
              for name in files:
                  pack.write(name)
          version = int(open("version.txt").read())
          digest = hashlib.sha256(open("tiny-update.zip", "rb").read()).hexdigest()
          with open("update.json", "w") as f:
              json.dump({"version": version, "sha256": digest}, f)
          print("update pack for version", version)
          EOF
          mv tiny-update.zip update.json "$GITHUB_WORKSPACE/"

      - name: Collect both apps
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Put everything on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Tiny Chatbot (build ${{ github.run_number }})
          files: |
            Tiny-Chatbot-Mac.zip
            Tiny-Chatbot-Windows.exe
            tiny-update.zip
            update.json
          body: |
            Mac: download Tiny-Chatbot-Mac.zip, open it, and open Tiny Chatbot. For Macs with Apple chips (M1 or newer).
            Windows: download Tiny-Chatbot-Windows.exe and double-click it. If a blue box appears, click More info, then Run anyway.
            Apps already installed update themselves to this version.

