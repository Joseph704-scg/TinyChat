<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny chatbot 💬</title>
<!--
  The chat page for your bot. webchat.py serves this file.
  Change the colours in :root, the words in <header>, or anything else: refresh
  the browser to see your edit. The part that talks to the bot is the
  function askBot() near the bottom.
-->
<style>
  :root {
    --paper: #EEF2F7;
    --ink: #14213D;
    --blue: #2F5DA8;
    --quiet: #5C6B82;
    --marker: #FFD84D;
    --line: #C9D3E1;
    --yours: #14213D;
    --yours-text: #EEF2F7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101826;
      --ink: #E6ECF5;
      --blue: #9BBCF2;
      --quiet: #93A1B8;
      --marker: #7A6410;
      --line: #2A3850;
      --yours: #E6ECF5;
      --yours-text: #101826;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  .column { width: 100%; max-width: 36rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }

  header { padding-top: 2.5rem; }
  h1 { font-size: 4.25rem; line-height: 0.9; letter-spacing: -0.04em; font-weight: 800; margin: 0; color: var(--blue); }
  .about { margin: 0.75rem 0 0; color: var(--quiet); max-width: 28rem; }

  main { flex: 1; padding-top: 1.75rem; padding-bottom: 1.5rem; }
  .starters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1.75rem; padding: 0; list-style: none; }
  .starters button {
    font: inherit; font-size: 0.9375rem; color: var(--ink); background: none; cursor: pointer;
    border: 1.5px dashed var(--line); border-radius: 999px; padding: 0.3rem 0.8rem;
  }
  .starters button:hover { border-style: solid; border-color: var(--blue); }

  .talk { display: flex; flex-direction: column; gap: 1rem; }
  .talk > div { scroll-margin-bottom: 6rem; }   /* keep new lines clear of the message box */
  .you {
    align-self: flex-end; max-width: 85%;
    background: var(--yours); color: var(--yours-text);
    padding: 0.5rem 0.9rem; border-radius: 1.1rem 1.1rem 0.25rem 1.1rem;
    overflow-wrap: anywhere;
  }
  .bot { align-self: flex-start; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot .words { color: var(--blue); font-weight: 600; }
  .bot .words:empty::after { content: "…"; color: var(--quiet); }
  .bot .tool {
    display: inline-block; margin-bottom: 0.2rem; font-size: 0.875rem; color: var(--ink);
    background: linear-gradient(transparent 45%, var(--marker) 45%); padding: 0 0.2rem;
  }
  .bot.problem .words { color: var(--ink); font-weight: 400; }

  form {
    position: sticky; bottom: 0; background: var(--paper);
    border-top: 1.5px solid var(--line); padding-top: 0.75rem; padding-bottom: 1rem;
    display: flex; gap: 0.5rem;
  }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent;
    border: 1.5px solid var(--line); border-radius: 0.8rem; padding: 0.6rem 0.8rem;
  }
  input::placeholder { color: var(--quiet); }
  form button {
    font: inherit; font-weight: 700; color: var(--paper); background: var(--blue);
    border: 0; border-radius: 0.8rem; padding: 0.6rem 1.1rem; cursor: pointer;
  }
  form button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .hidden-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (max-width: 30rem) { h1 { font-size: 3.25rem; } header { padding-top: 1.5rem; } }
</style>
</head>
<body>
<header class="column">
  <h1>tiny chatbot 💬</h1>
  <p class="about">A chatbot brain built from scratch by Acculon Solutions<span id="size"></span>. It makes small talk, and it can check the time, the weather, the news and Wikipedia.</p>
</header>

<main class="column">
  <ul class="starters" id="starters" aria-label="Things to try">
    <li><button type="button">hello</button></li>
    <li><button type="button">tell me a joke</button></li>
    <li><button type="button">weather in tokyo</button></li>
    <li><button type="button">who was ada lovelace</button></li>
    <li><button type="button">what is the news</button></li>
    <li><button type="button">what time is it</button></li>
  </ul>
  <div class="talk" id="talk" aria-live="polite"></div>
</main>

<form class="column" id="form">
  <label class="hidden-label" for="message">Message</label>
  <input id="message" autocomplete="off" maxlength="300" placeholder="Say something to tiny" autofocus>
  <button id="send">Send</button>
</form>

<script>
  // Where the bot lives. If you put this page on another website, change this
  // to the full address of the computer running webchat.py.
  const BOT = location.protocol === "file:" ? "http://localhost:8000" : "";

  const talk = document.getElementById("talk");
  const form = document.getElementById("form");
  const box = document.getElementById("message");
  const sendButton = document.getElementById("send");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Send one message to the bot and get back {reply, tool}.
  async function askBot(message) {
    const response = await fetch(BOT + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    return response.json();
  }

  function add(kind, text) {
    const line = document.createElement("div");
    line.className = kind;
    line.textContent = text;
    talk.append(line);
    line.scrollIntoView({ block: "end", behavior: calm ? "auto" : "smooth" });
    return line;
  }

  // The brain writes one letter at a time, so the page shows it that way.
  async function typeOut(element, text) {
    if (calm) { element.textContent = text; return; }
    const pause = Math.max(4, Math.min(22, 1400 / text.length));
    for (const letter of text) {
      element.textContent += letter;
      await new Promise(done => setTimeout(done, pause));
    }
  }

  async function say(message) {
    message = message.trim();
    if (!message || sendButton.disabled) return;
    sendButton.disabled = true;
    box.value = "";
    add("you", message);
    const line = add("bot", "");
    const words = document.createElement("span");
    words.className = "words";
    line.append(words);
    try {
      const answer = await askBot(message);
      if (answer.error) throw new Error(answer.error);
      if (answer.tool) {
        const tool = document.createElement("span");
        tool.className = "tool";
        tool.textContent = "used the " + answer.tool + " tool";
        line.prepend(tool, document.createElement("br"));
      }
      await typeOut(words, answer.reply);
    } catch (problem) {
      line.classList.add("problem");
      words.textContent = "The bot is not answering. In Terminal, start it with: python3 webchat.py";
    }
    line.scrollIntoView({ block: "end" });
    sendButton.disabled = false;
    box.focus();
  }

  form.addEventListener("submit", event => { event.preventDefault(); say(box.value); });
  document.getElementById("starters").addEventListener("click", event => {
    if (event.target.tagName === "BUTTON") say(event.target.textContent);
  });

  // Show how big the brain is, if the bot is running.
  fetch(BOT + "/info").then(r => r.json()).then(info => {
    document.getElementById("size").textContent = ", " + info.numbers.toLocaleString() + " numbers big";
  }).catch(() => {});
</script>
</body>
</html>
